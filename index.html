<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo de Seguimiento</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        /* Estilo para el contenido del detalle */
        .info-card { width: 300px; padding: 10px; }
        .info-card .foto-perfil { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; background-color: #ecf0f1; display: flex; align-items: center; justify-content: center; color: #bdc3c7; font-size: 12px; border: 1px solid #ddd; }
        .info-card h2 { margin: 0 0 10px 0; font-size: 18px; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 5px;}
        .info-card table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .info-card th { text-align: left; font-size: 12px; color: #7f8c8d; padding: 6px 0; width: 35%; border-bottom: 1px solid #eee; }
        .info-card td { font-size: 13px; padding: 6px 0; color: #34495e; font-weight: 500; border-bottom: 1px solid #eee; }
        
        /* Etiquetas de estado */
        .badge { padding: 3px 6px; border-radius: 4px; color: white; font-size: 11px; text-transform: uppercase; display: inline-block; }
        .bg-judicial { background-color: #e74c3c; }
        .bg-salud { background-color: #27ae60; }
        .bg-estado { background-color: #f39c12; }
        .bg-default { background-color: #95a5a6; }

        .header-panel { position: absolute; top: 10px; left: 50px; z-index: 1000; background: white; padding: 10px 20px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 15px; }
        .stat { font-size: 14px; color: #2c3e50; font-weight: bold; }
        .btn-toggle-route { background: #3498db; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-toggle-route:hover { background: #2980b9; }
    </style>
</head>
<body>

    <div class="header-panel">
        <div class="stat">Casos Únicos: <span id="total-casos">0</span></div>
        <div class="stat">Judicializados: <span id="total-judicial" style="color:#e74c3c">0</span></div>
        <button class="btn-toggle-route" id="toggle-route">Ocultar Recorrido</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        /**
         * CONFIGURACIÓN DE GOOGLE DRIVE
         * 1. En tu Google Sheet, ve a Archivo > Compartir > Compartir con otros.
         * 2. Cambia el acceso general a "Cualquier persona con el enlace" (lector).
         * 3. Copia el ID de la URL (entre /d/ y /edit) y pégalo aquí abajo.
         */
        const SHEET_ID = 'TU_ID_DE_GOOGLE_SHEET_AQUI'; 
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

        const map = L.map('map').setView([-34.6037, -58.3816], 12);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap contributors © CARTO'
        }).addTo(map);

        const markers = L.markerClusterGroup({ 
            spiderfyOnMaxZoom: true, 
            showCoverageOnHover: false, 
            zoomToBoundsOnClick: true 
        });

        let routeCoords = [];
        let routePolyline;

        function getJudicialColor(status) {
            if (!status || status === 'S/D' || String(status).toLowerCase().includes('sin')) return 'bg-default';
            return 'bg-judicial';
        }

        function getEstadoColor(estado) {
            if(estado === 'RESUELTO') return 'bg-salud';
            if(estado === 'SEGUIMIENTO') return 'bg-estado';
            if(estado === 'PERDIDA DE PARADERO') return 'bg-judicial';
            return 'bg-default';
        }

        function generarContenido(p) {
            let fotoHtml = '';
            if (p.foto && p.foto !== '' && p.foto !== 'null') {
                fotoHtml = `<img src="${p.foto}" alt="Foto de ${p.nombre}" class="foto-perfil">`;
            } else {
                fotoHtml = `<div class="foto-perfil">📷 Sin imagen disponible</div>`;
            }

            let informeHtml = '';
            if (p.informe && p.informe !== 'S/D' && p.informe !== '' && p.informe !== 'null') {
                informeHtml = `
                    <div style="margin-top:15px; padding-top:10px; border-top:1px solid #eee; text-align:center;">
                        <a href="${p.informe}" target="_blank" style="font-size:12px; color:#3498db; text-decoration:none; font-weight:bold; display:block; margin-bottom:5px;">
                            📄 VER INFORME ASOCIADO
                        </a>
                        <div style="font-size:10px; color:#7f8c8d; word-break:break-all;">${p.informe}</div>
                    </div>
                `;
            }

            const saludText = p.salud ? String(p.salud) : 'S/D';

            return `
                <div class="info-card">
                    ${fotoHtml}
                    <h2>${p.nombre || 'Sin nombre'}</h2>
                    <table>
                        <tr><th>DNI</th><td>${p.dni || 'S/D'}</td></tr>
                        <tr><th>DIRECCIÓN</th><td>${p.ubicacion || 'S/D'}</td></tr>
                        <tr><th>ACTUALIZACIÓN</th><td>${p.fecha || 'Sin fecha'}</td></tr>
                        <tr><th>ESTADO</th><td><span class="badge ${getEstadoColor(p.estado)}">${p.estado || 'S/D'}</span></td></tr>
                        <tr><th>JUDICIAL</th><td><span class="badge ${getJudicialColor(p.judicial)}">${p.judicial || 'S/D'}</span></td></tr>
                        <tr><th>DX / SALUD</th><td><span class="badge bg-default" title="${saludText}">${saludText.length > 35 ? saludText.substring(0,35) + '...' : saludText}</span></td></tr>
                    </table>
                    ${informeHtml}
                </div>
            `;
        }

        async function loadData() {
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error("No se pudo obtener el archivo");
                const csvText = await response.text();
                
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        renderData(results.data);
                    },
                    error: function(err) {
                        console.error("Error al parsear CSV:", err);
                    }
                });
            } catch (error) {
                console.error("Error:", error);
                if (SHEET_ID === 'TU_ID_DE_GOOGLE_SHEET_AQUI') {
                    console.log("Esperando configuración de SHEET_ID...");
                } else {
                    alert("Error al cargar datos. Verifica que el Google Sheet esté compartido como 'Cualquier persona con el enlace'.");
                }
            }
        }

        function renderData(personas) {
            markers.clearLayers();
            routeCoords = [];
            if (routePolyline) map.removeLayer(routePolyline);

            let totalCasos = 0;
            let totalJudicial = 0;

            personas.forEach(p => {
                let lat, lng;
                
                // Soporte para lat/lng en columnas separadas o columna coords
                if (p.lat && p.lng) {
                    lat = parseFloat(p.lat);
                    lng = parseFloat(p.lng);
                } else if (p.coords) {
                    const c = String(p.coords).replace(/[\[\]]/g, '').split(',');
                    lat = parseFloat(c[0]);
                    lng = parseFloat(c[1]);
                }

                if (!isNaN(lat) && !isNaN(lng)) {
                    const marker = L.marker([lat, lng]).bindPopup(generarContenido(p));
                    markers.addLayer(marker);
                    routeCoords.push([lat, lng]);
                    
                    totalCasos++;
                    if (p.judicial && !String(p.judicial).toLowerCase().includes('sin') && p.judicial !== 'S/D') {
                        totalJudicial++;
                    }
                }
            });

            map.addLayer(markers);
            
            document.getElementById('total-casos').innerText = totalCasos;
            document.getElementById('total-judicial').innerText = totalJudicial;

            if (routeCoords.length > 0) {
                routePolyline = L.polyline(routeCoords, {
                    color: '#3498db', weight: 3, opacity: 0.7, dashArray: '10, 10'
                }).addTo(map);
                map.fitBounds(markers.getBounds(), { padding: [50, 50] });
            }
        }

        const btnToggle = document.getElementById('toggle-route');
        btnToggle.addEventListener('click', function() {
            if (map.hasLayer(routePolyline)) {
                map.removeLayer(routePolyline);
                this.innerText = 'Mostrar Recorrido';
                this.style.background = '#95a5a6';
            } else {
                map.addLayer(routePolyline);
                this.innerText = 'Ocultar Recorrido';
                this.style.background = '#3498db';
            }
        });

        loadData();
    </script>
</body>
</html>
