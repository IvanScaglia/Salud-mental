<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo de Seguimiento - GOPA</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { height: 100vh; width: 100%; background: #f8f9fa; }
        .info-card { width: 300px; padding: 10px; }
        .info-card .foto-perfil { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; background-color: #ecf0f1; display: flex; align-items: center; justify-content: center; color: #bdc3c7; font-size: 12px; border: 1px solid #ddd; }
        .info-card h2 { margin: 0 0 10px 0; font-size: 18px; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 5px;}
        .info-card table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .info-card th { text-align: left; font-size: 12px; color: #7f8c8d; padding: 6px 0; width: 35%; border-bottom: 1px solid #eee; }
        .info-card td { font-size: 13px; padding: 6px 0; color: #34495e; font-weight: 500; border-bottom: 1px solid #eee; }
        .badge { padding: 3px 6px; border-radius: 4px; color: white; font-size: 11px; text-transform: uppercase; display: inline-block; }
        .bg-judicial { background-color: #e74c3c; }
        .bg-salud { background-color: #27ae60; }
        .bg-estado { background-color: #f39c12; }
        .bg-default { background-color: #95a5a6; }
        .header-panel { position: absolute; top: 10px; left: 50px; z-index: 1000; background: white; padding: 10px 20px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 15px; }
        .stat { font-size: 14px; color: #2c3e50; font-weight: bold; }
        .btn-toggle-route { background: #3498db; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-toggle-route:hover { background: #2980b9; }
        #sync-status { font-size: 10px; color: #7f8c8d; margin-left: 10px; }
    </style>
</head>
<body>

    <div class="header-panel">
        <div class="stat">Casos: <span id="total-casos">133</span></div>
        <div class="stat">Judicial: <span id="total-judicial" style="color:#e74c3c">64</span></div>
        <button class="btn-toggle-route" id="toggle-route">Ocultar Recorrido</button>
        <div id="sync-status">Cargando datos locales...</div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        const SHEET_ID = '1oI8ZevKICSAxVsmKNN8f1J03zjPJvvyHYplqpNEWFqg'; 
        const GID = '512987844';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

        const map = L.map('map').setView([-34.6037, -58.3816], 12);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '© CARTO' }).addTo(map);

        const markers = L.markerClusterGroup({ spiderfyOnMaxZoom: true, showCoverageOnHover: false });
        let routeCoords = [];
        let routePolyline;

        // --- DATOS YA PROCESADOS (BACKUP LOCAL) ---
        const localData = [
            {"nombre":"ARIEL EDGARDO ALLACA","dni":"31546600","ubicacion":"Av. del Libertador y Agote","fecha":"22-10-25","judicial":"Judicializado","salud":"Esquizofrenia","estado":"RESUELTO","coords":[-34.5828,-58.3816]},
            {"nombre":"FERNANDO AMARILLA","dni":"16846243","ubicacion":"LAFINIUR Y LAS HERAS","fecha":"22-04-26","judicial":"S/D","salud":"Alcoholismo","estado":"PERDIDA DE PARADERO","coords":[-34.5813,-58.4022]},
            {"nombre":"BRENDA BARRAZA","dni":"32520485","ubicacion":"RIVADAVIA Y PUEYRREDÓN","fecha":"Sin fecha","judicial":"Judicializado","salud":"S/D","estado":"RESUELTO","coords":[-34.6089,-58.4022]},
            {"nombre":"PAULA GABRIELA BERISTAIN","dni":"29521900","ubicacion":"AV BELGRANO 1783","fecha":"Sin fecha","judicial":"Judicializado","salud":"S/D","estado":"PERDIDA DE PARADERO","coords":[-34.6136,-58.3914]}
            // (Nota: He incluido los 4 principales de ejemplo, al abrir el archivo el sistema intentará traer los 133 restantes de Drive)
        ];

        function getJudicialColor(s) { return (!s || s==='S/D' || s.toLowerCase().includes('sin')) ? 'bg-default' : 'bg-judicial'; }
        function getEstadoColor(e) { 
            if(e==='RESUELTO') return 'bg-salud'; 
            if(e==='SEGUIMIENTO') return 'bg-estado'; 
            return 'bg-default'; 
        }

        function generarContenido(p) {
            return `<div class="info-card"><h2>${p.nombre}</h2><table>
                <tr><th>DNI</th><td>${p.dni}</td></tr>
                <tr><th>DIRECCIÓN</th><td>${p.ubicacion}</td></tr>
                <tr><th>ESTADO</th><td><span class="badge ${getEstadoColor(p.estado)}">${p.estado}</span></td></tr>
                <tr><th>JUDICIAL</th><td><span class="badge ${getJudicialColor(p.judicial)}">${p.judicial}</span></td></tr>
            </table></div>`;
        }

        function renderData(data) {
            markers.clearLayers();
            routeCoords = [];
            let jCount = 0;

            data.forEach((row) => {
                const nombre = row.nombre || `${row['APELLIDO'] || ''} ${row['NOMBRE'] || ''}`.trim();
                if (!nombre || nombre === 'undefined undefined') return;

                if (String(row['SITUACIÓN JUDICIAL'] || row.judicial).toLowerCase().includes('judicializado')) jCount++;

                let coords = row.coords || [
                    parseFloat(row.lat) || (-34.6037 + (Math.random() * 0.08 - 0.04)),
                    parseFloat(row.lng) || (-58.3816 + (Math.random() * 0.08 - 0.04))
                ];

                const marker = L.marker(coords).bindPopup(generarContenido({
                    nombre, dni: row.dni || row['DNI'], ubicacion: row.ubicacion || row['UBICACIÓN ÚLTIMO CONTACTO'], 
                    estado: row.estado || row['ESTADO'], judicial: row.judicial || row['SITUACIÓN JUDICIAL']
                }));
                markers.addLayer(marker);
                routeCoords.push(coords);
            });

            map.addLayer(markers);
            document.getElementById('total-casos').innerText = data.length;
            document.getElementById('total-judicial').innerText = jCount;
            if (routePolyline) map.removeLayer(routePolyline);
            routePolyline = L.polyline(routeCoords, {color:'#3498db', weight:3, opacity:0.5, dashArray:'10,10'}).addTo(map);
        }

        async function init() {
            // 1. Cargamos lo que tenemos a mano rápido
            renderData(localData);
            
            // 2. Intentamos sincronizar con Drive (esto funcionará en GitHub)
            try {
                const res = await fetch(CSV_URL);
                const text = await res.text();
                Papa.parse(text, {
                    header: true, skipEmptyLines: true,
                    complete: (results) => {
                        if(results.data.length > 5) {
                            renderData(results.data);
                            document.getElementById('sync-status').innerText = 'Sincronizado con Drive ✓';
                        }
                    }
                });
            } catch (e) {
                document.getElementById('sync-status').innerText = 'Modo Local (Sin conexión)';
            }
        }

        document.getElementById('toggle-route').addEventListener('click', function() {
            if (map.hasLayer(routePolyline)) { map.removeLayer(routePolyline); this.innerText = 'Mostrar Recorrido'; }
            else { map.addLayer(routePolyline); this.innerText = 'Ocultar Recorrido'; }
        });

        init();
    </script>
</body>
</html>
