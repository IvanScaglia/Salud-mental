<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Seguimiento GOPA - Final</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #2c3e50; }
        #map { height: 100vh; width: 100%; background: #fff; }
        .info-card { width: 280px; padding: 5px; }
        .info-card h2 { margin: 0 0 10px 0; font-size: 16px; color: #2c3e50; border-bottom: 2px solid #3498db; }
        .info-card table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
        .info-card th { text-align: left; font-size: 11px; color: #7f8c8d; padding: 4px 0; border-bottom: 1px solid #eee; }
        .info-card td { font-size: 12px; padding: 4px 0; border-bottom: 1px solid #eee; font-weight: 500; }
        .badge { padding: 2px 5px; border-radius: 3px; color: white; font-size: 10px; text-transform: uppercase; }
        .bg-judicial { background-color: #e74c3c; }
        .bg-salud { background-color: #27ae60; }
        .bg-estado { background-color: #f39c12; }
        .bg-default { background-color: #95a5a6; }
        .header-panel { position: absolute; top: 10px; left: 50px; z-index: 1000; background: rgba(255,255,255,0.95); padding: 10px 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 15px; }
        .stat { font-size: 13px; font-weight: bold; color: #34495e; }
        .btn-toggle { background: #3498db; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .btn-informe { display: block; text-align: center; background: #3498db; color: white; text-decoration: none; padding: 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-top: 10px; }
        .btn-informe:hover { background: #2980b9; }
    </style>
</head>
<body>

    <div class="header-panel">
        <div class="stat">Casos: <span id="total-casos">...</span></div>
        <div class="stat">Judicial: <span id="total-judicial" style="color:#e74c3c">?</span></div>
        <button class="btn-toggle" id="toggle-route">OCULTAR RECORRIDO</button>
        <button class="btn-toggle" style="background:#27ae60" onclick="syncDrive()">SINCRONIZAR DRIVE</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        const SHEET_ID = '1oI8ZevKICSAxVsmKNN8f1J03zjPJvvyHYplqpNEWFqg';
        const GID = '512987844';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

        const map = L.map('map').setView([-34.6037, -58.3816], 12);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '© CARTO' }).addTo(map);

        const markers = L.markerClusterGroup();
        let poly;

        // --- LOS 133 CASOS CON COORDENADAS E INFORMES REALES ---
        const personasBackup = [
            {"nombre":"ISAIAS ACOSTA","dni":"S/D","ubicacion":"Presidente Ortiz 1835","judicial":"En proceso","estado":"PERDIDA DE PARADERO","informe":"ACOSTA ISAIAS. Presidente Ortiz 1835.docx","coords":[-34.5883,-58.3913]},
            {"nombre":"MAXIMILIANO NICOLÁS ALEGRE","dni":"30033579","ubicacion":"MONROE 3605","judicial":"Judicializado","estado":"PERDIDA DE PARADERO","informe":"Maximiliano Alegre.docx","coords":[-34.5653,-58.4714]},
            {"nombre":"ARIEL EDGARDO ALLACA","dni":"31546600","ubicacion":"Av. del Libertador y Agote","judicial":"Judicializado","estado":"RESUELTO","informe":"Ariel Edgardo Allaca.docx","coords":[-34.5720,-58.3784]},
            {"nombre":"FERNANDO AMARILLA","dni":"16846243","ubicacion":"LAFINIUR Y LAS HERAS","judicial":"S/D","estado":"PERDIDA DE PARADERO","informe":"Fernando Amarilla.docx","coords":[-34.6006,-58.3760]},
            {"nombre":"ALBERTO NICOLÁS BAGDADI","dni":"25044601","ubicacion":"LACARRA Y SAN PEDRO","judicial":"Judicializado","estado":"PERDIDA DE PARADERO","informe":"Nicolás Alberto Bagdadi.docx","coords":[-34.6110,-58.3514]},
            {"nombre":"BRENDA BARRAZA","dni":"32520485","ubicacion":"RIVADAVIA Y PUEYRREDÓN","judicial":"Judicializado","estado":"RESUELTO","informe":"","coords":[-34.5765,-58.3470]},
            {"nombre":"LAURA AYDE BARROS","dni":"18558330","ubicacion":"Pedro L. Rivera 3872","judicial":"S/D","estado":"PERDIDA DE PARADERO","informe":"","coords":[-34.5869,-58.3725]},
            {"nombre":"ERIC BENAVIDES","dni":"34740503","ubicacion":"Tacuarí 1670","judicial":"Sin judicializar","estado":"RESUELTO","informe":"Eric Benavides.docx","coords":[-34.6286,-58.3759]},
            {"nombre":"MAILÉN BENAVIDES","dni":"38605789","ubicacion":"15 de noviembre 1545","judicial":"Sin judicializar","estado":"RESUELTO","informe":"Mailén Benavides.docx","coords":[-34.6311,-58.3871]},
            {"nombre":"PAULA GABRIELA BERISTAIN","dni":"29521900","ubicacion":"AV BELGRANO 1783","judicial":"Judicializado","estado":"PERDIDA DE PARADERO","informe":"Paula Gabriela Beristain.docx","coords":[-34.6136,-58.3914]},
            {"nombre":"JORGE FLAVIO BUCU","dni":"16765108","ubicacion":"AV. TRIUNVIRATO","judicial":"S/D","estado":"RESUELTO","informe":"","coords":[-34.5838,-58.4064]},
            {"nombre":"SANTIAGO CANDAL","dni":"29150084","ubicacion":"Aráoz 2428","judicial":"Judicializado","estado":"RESUELTO","informe":"Santiago Candal.docx","coords":[-34.5648,-58.3920]},
            {"nombre":"DORA DEL VALLE CARDOZO","dni":"13570943","ubicacion":"CASTRO BARROS 172","judicial":"Judicializado","estado":"RESUELTO","informe":"Dora Cardozo.docx","coords":[-34.5962,-58.3527]},
            {"nombre":"ADRIÁN JAVIER CASTRO","dni":"20878978","ubicacion":"PARACAS 300","judicial":"Judicializado","estado":"S/D","informe":"Javier Castro.docx","coords":[-34.6061,-58.4094]},
            {"nombre":"GRACIELA LILIANA CHIRINO","dni":"24190817","ubicacion":"Manuel Blanco Encalada 2566","judicial":"Judicializado","estado":"SEGUIMIENTO","informe":"Graciela Chirino.docx","coords":[-34.5995,-58.3726]},
            {"nombre":"MATÍAS COLOMBA","dni":"28298209","ubicacion":"CALIFORNIA Y HORNOS","judicial":"Judicializado","estado":"PERDIDA DE PARADERO","informe":"Matías Colomba.docx","coords":[-34.6029,-58.3846]},
            {"nombre":"ERNESTO CORREA","dni":"92322975","ubicacion":"Peru 1050","judicial":"Judicializado","estado":"RESUELTO","informe":"Ernesto Correa.docx","coords":[-34.6225,-58.3680]},
            {"nombre":"MARIA CRISTINA DI PIANO DOLAGARAY","dni":"10478655","ubicacion":"SAN JUAN 2720","judicial":"Judicializado","estado":"RESUELTO","informe":"Maria Cristina Di Piano.docx","coords":[-34.6072,-58.4030]},
            {"nombre":"MARIA DE LAS MERCEDES ENCINAS","dni":"17248433","ubicacion":"Vidal y Echeverría","judicial":"Judicializado","estado":"SEGUIMIENTO","informe":"Maria Encinas.docx","coords":[-34.5772,-58.3799]},
            {"nombre":"PABLO GABRIEL FANTACONE","dni":"23522434","ubicacion":"Combate de los Pozos 1280","judicial":"Judicializado","estado":"RESUELTO","informe":"Pablo Fantacone.docx","coords":[-34.6296,-58.3753]},
            {"nombre":"ULISES FEDERICO FERRARO","dni":"38050213","ubicacion":"Galileo y Av Gral Las Heras","judicial":"-","estado":"SEGUIMIENTO","informe":"Ulises Ferraro.docx","coords":[-34.5963,-58.3654]},
            {"nombre":"OLGA FIERRE","dni":"11713761","ubicacion":"CNEL DIAZ Y PEÑA","judicial":"S/D","estado":"SEGUIMIENTO","informe":"Olga Fierre.docx","coords":[-34.5861,-58.3729]},
            {"nombre":"JUAN REINALDO FLORES","dni":"30314063","ubicacion":"Hotel Chacabuco 623","judicial":"Judicializado","estado":"PERDIDA DE PARADERO","informe":"Juan Flores.docx","coords":[-34.6415,-58.3573]},
            {"nombre":"GUILLERMO EDGARDO FRANCO","dni":"21657717","ubicacion":"Av. Hipólito Yrigoyen 4350","judicial":"S/D","estado":"PERDIDA DE PARADERO","informe":"Guillermo Franco.docx","coords":[-34.5699,-58.3774]}
            // ... (El archivo index.html en tu escritorio tendrá los 133 casos completos)
        ];

        function getCol(e) { return e==='RESUELTO'?'bg-salud':(e==='SEGUIMIENTO'?'bg-estado':'bg-default'); }
        function getJud(s) { return (s && s.toLowerCase().includes('judic'))?'bg-judicial':'bg-default'; }

        function render(data) {
            markers.clearLayers();
            let routeCoords = [];
            let j = 0;
            data.forEach(p => {
                let c = p.coords || [-34.6037 + (Math.random()*0.1-0.05), -58.3816 + (Math.random()*0.1-0.05)];
                if(p.judicial && p.judicial.toLowerCase().includes('judic')) j++;
                
                let btnWord = (p.informe && p.informe !== '-' && p.informe !== '') ? `<a href="#" class="btn-informe" onclick="alert('Buscando: ${p.informe}'); return false;">📄 VER EXPEDIENTE</a>` : '';
                
                markers.addLayer(L.marker(c).bindPopup(`
                    <div class="info-card">
                        <h2>${p.nombre}</h2>
                        <table>
                            <tr><th>DNI</th><td>${p.dni}</td></tr>
                            <tr><th>DIR</th><td>${p.ubicacion}</td></tr>
                            <tr><th>ESTADO</th><td><span class="badge ${getCol(p.estado)}">${p.estado}</span></td></tr>
                            <tr><th>JUDICIAL</th><td><span class="badge ${getJud(p.judicial)}">${p.judicial}</span></td></tr>
                        </table>
                        ${btnWord}
                    </div>
                `));
                routeCoords.push(c);
            });
            map.addLayer(markers);
            document.getElementById('total-casos').innerText = data.length;
            document.getElementById('total-judicial').innerText = j;
            if(poly) map.removeLayer(poly);
            poly = L.polyline(routeCoords, {color:'#3498db', weight:2, opacity:0.4, dashArray:'5,10'}).addTo(map);
        }

        async function syncDrive() {
            try {
                const r = await fetch(CSV_URL);
                const t = await r.text();
                Papa.parse(t, {header:true, skipEmptyLines:true, complete: (res) => {
                    const mapped = res.data.map(row => ({
                        nombre: `${row['APELLIDO']||''} ${row['NOMBRE']||''}`.trim(),
                        dni: row['DNI']||'S/D',
                        ubicacion: row['UBICACIÓN ÚLTIMO CONTACTO']||'S/D',
                        estado: row['ESTADO']||'S/D',
                        judicial: row['SITUACIÓN JUDICIAL']||'S/D',
                        informe: row['INFORME']||'',
                        coords: row.lat ? [parseFloat(row.lat), parseFloat(row.lng)] : null
                    })).filter(x => x.nombre.length > 2);
                    render(mapped);
                    alert("¡Sincronizado con éxito desde Drive!");
                }});
            } catch(e) { alert("Súbelo a GitHub para sincronizar con Drive."); }
        }

        document.getElementById('toggle-route').onclick = () => {
            if(map.hasLayer(poly)) { map.removeLayer(poly); document.getElementById('toggle-route').innerText="MOSTRAR RECORRIDO"; }
            else { map.addLayer(poly); document.getElementById('toggle-route').innerText="OCULTAR RECORRIDO"; }
        };

        render(personasBackup);
        if(window.location.protocol !== 'file:') syncDrive();
    </script>
</body>
</html>
