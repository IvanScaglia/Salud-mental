<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo de Seguimiento - GOPA</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        /* Estilo para el contenido del detalle */
        .info-card { width: 300px; padding: 10px; }
        .info-card .foto-perfil { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; background-color: #ecf0f1; display: flex; align-items: center; justify-content: center; color: #bdc3c7; font-size: 12px; border: 1px solid #ddd; }
        .info-card h2 { margin: 0 0 10px 0; font-size: 18px; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 5px;}
        .info-card table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .info-card th { text-align: left; font-size: 12px; color: #7f8c8d; padding: 6px 0; width: 35%; border-bottom: 1px solid #eee; }
        .info-card td { font-size: 13px; padding: 6px 0; color: #34495e; font-weight: 500; border-bottom: 1px solid #eee; }
        
        /* Etiquetas de estado */
        .badge { padding: 3px 6px; border-radius: 4px; color: white; font-size: 11px; text-transform: uppercase; display: inline-block; }
        .bg-judicial { background-color: #e74c3c; }
        .bg-salud { background-color: #27ae60; }
        .bg-estado { background-color: #f39c12; }
        .bg-default { background-color: #95a5a6; }

        .header-panel { position: absolute; top: 10px; left: 50px; z-index: 1000; background: white; padding: 10px 20px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 15px; }
        .stat { font-size: 14px; color: #2c3e50; font-weight: bold; }
        .btn-toggle-route { background: #3498db; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-toggle-route:hover { background: #2980b9; }

        #sync-status { font-size: 10px; color: #7f8c8d; margin-left: 10px; }
    </style>
</head>
<body>

    <div class="header-panel">
        <div class="stat">Casos Únicos: <span id="total-casos">Cargando...</span></div>
        <div class="stat">Judicializados: <span id="total-judicial" style="color:#e74c3c">-</span></div>
        <button class="btn-toggle-route" id="toggle-route">Ocultar Recorrido</button>
        <div id="sync-status">Sincronizando con Drive...</div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        // CONFIGURACIÓN DE DRIVE
        const SHEET_ID = '1oI8ZevKICSAxVsmKNN8f1J03zjPJvvyHYplqpNEWFqg'; 
        const GID = '512987844'; // Pestaña 'Casos Unicos'
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

        const map = L.map('map').setView([-34.6037, -58.3816], 12);
        
        // Mapa base CartoDB (Limpio y profesional)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap contributors © CARTO'
        }).addTo(map);

        const markers = L.markerClusterGroup({ 
            spiderfyOnMaxZoom: true, 
            showCoverageOnHover: false, 
            zoomToBoundsOnClick: true 
        });

        let routeCoords = [];
        let routePolyline;

        function getJudicialColor(status) {
            if (!status || status === 'S/D' || String(status).toLowerCase().includes('sin')) return 'bg-default';
            return 'bg-judicial';
        }

        function getEstadoColor(estado) {
            if(estado === 'RESUELTO') return 'bg-salud';
            if(estado === 'SEGUIMIENTO') return 'bg-estado';
            if(estado === 'PERDIDA DE PARADERO') return 'bg-judicial';
            return 'bg-default';
        }

        function generarContenido(p) {
            let fotoHtml = p.foto ? `<img src="${p.foto}" class="foto-perfil">` : `<div class="foto-perfil">📷 Sin imagen</div>`;
            
            let informeHtml = '';
            if (p.informe && p.informe !== 'S/D' && p.informe !== '') {
                const link = p.informe.startsWith('http') ? p.informe : `https://${p.informe}`;
                informeHtml = `
                    <div style="margin-top:15px; padding-top:10px; border-top:1px solid #eee; text-align:center;">
                        <a href="${link}" target="_blank" style="font-size:12px; color:#3498db; text-decoration:none; font-weight:bold; display:block; margin-bottom:5px;">
                            📄 VER INFORME ASOCIADO
                        </a>
                        <div style="font-size:10px; color:#7f8c8d; word-break:break-all;">${p.informe}</div>
                    </div>
                `;
            }

            return `
                <div class="info-card">
                    ${fotoHtml}
                    <h2>${p.nombre}</h2>
                    <table>
                        <tr><th>DNI</th><td>${p.dni}</td></tr>
                        <tr><th>DIRECCIÓN</th><td>${p.ubicacion}</td></tr>
                        <tr><th>ACTUALIZACIÓN</th><td>${p.fecha}</td></tr>
                        <tr><th>ESTADO</th><td><span class="badge ${getEstadoColor(p.estado)}">${p.estado}</span></td></tr>
                        <tr><th>JUDICIAL</th><td><span class="badge ${getJudicialColor(p.judicial)}">${p.judicial}</span></td></tr>
                        <tr><th>DX / SALUD</th><td><span class="badge bg-default" title="${p.salud}">${p.salud.length > 35 ? p.salud.substring(0,35) + '...' : p.salud}</span></td></tr>
                    </table>
                    ${informeHtml}
                </div>
            `;
        }

        function renderData(data) {
            markers.clearLayers();
            routeCoords = [];
            let count = 0;
            let judicialCount = 0;

            data.forEach((row) => {
                const nombre = `${row['APELLIDO'] || ''} ${row['NOMBRE'] || ''}`.trim();
                if (!nombre || nombre === 'undefined undefined') return;

                count++;
                if (String(row['SITUACIÓN JUDICIAL']).toLowerCase().includes('judicializado')) judicialCount++;

                // Como el Excel no tiene coordenadas, ponemos los puntos cerca del Obelisco con un poco de azar 
                // para que se distribuyan en el mapa hasta que agregues columnas de Latitud/Longitud al Excel.
                let lat = -34.6037 + (Math.random() * 0.08 - 0.04);
                let lng = -58.3816 + (Math.random() * 0.08 - 0.04);

                const p = {
                    nombre: nombre,
                    dni: row['DNI'] || 'S/D',
                    ubicacion: row['UBICACIÓN ÚLTIMO CONTACTO'] || 'S/D',
                    fecha: row['Fecha de actualización '] || 'S/D',
                    judicial: row['SITUACIÓN JUDICIAL'] || 'S/D',
                    salud: row['DX PRESUNTIVO'] || 'S/D',
                    estado: row['ESTADO'] || 'S/D',
                    informe: row['INFORME'] || '',
                    foto: row['FOTO'] || null,
                    coords: [lat, lng]
                };

                const marker = L.marker(p.coords).bindPopup(generarContenido(p));
                markers.addLayer(marker);
                routeCoords.push(p.coords);
            });

            map.addLayer(markers);
            document.getElementById('total-casos').innerText = count;
            document.getElementById('total-judicial').innerText = judicialCount;

            if (routePolyline) map.removeLayer(routePolyline);
            routePolyline = L.polyline(routeCoords, {
                color: '#3498db', weight: 3, opacity: 0.5, dashArray: '10, 10'
            }).addTo(map);
        }

        async function loadFromDrive() {
            try {
                const response = await fetch(CSV_URL);
                const csvText = await response.text();
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        renderData(results.data);
                        document.getElementById('sync-status').innerText = 'Datos actualizados desde Drive ✓';
                    }
                });
            } catch (error) {
                console.error("Error cargando Drive:", error);
                document.getElementById('sync-status').innerText = 'Error al conectar con Drive';
            }
        }

        // Ejecutar carga inicial
        loadFromDrive();

        const btnToggle = document.getElementById('toggle-route');
        btnToggle.addEventListener('click', function() {
            if (map.hasLayer(routePolyline)) {
                map.removeLayer(routePolyline);
                this.innerText = 'Mostrar Recorrido';
                this.style.background = '#95a5a6';
            } else {
                map.addLayer(routePolyline);
                this.innerText = 'Ocultar Recorrido';
                this.style.background = '#3498db';
            }
        });
    </script>
</body>
</html>
