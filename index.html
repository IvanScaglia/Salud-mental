<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Seguimiento GOPA - Final</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #2c3e50; }
        #map { height: 100vh; width: 100%; background: #ffffff; }
        .info-card { width: 280px; padding: 5px; }
        .info-card h2 { margin: 0 0 10px 0; font-size: 16px; color: #2c3e50; border-bottom: 2px solid #3498db; }
        .info-card table { width: 100%; border-collapse: collapse; }
        .info-card th { text-align: left; font-size: 11px; color: #7f8c8d; padding: 4px 0; border-bottom: 1px solid #eee; }
        .info-card td { font-size: 12px; padding: 4px 0; border-bottom: 1px solid #eee; font-weight: 500; }
        .badge { padding: 2px 5px; border-radius: 3px; color: white; font-size: 10px; text-transform: uppercase; }
        .bg-judicial { background-color: #e74c3c; }
        .bg-salud { background-color: #27ae60; }
        .bg-estado { background-color: #f39c12; }
        .bg-default { background-color: #95a5a6; }
        .header-panel { position: absolute; top: 10px; left: 50px; z-index: 1000; background: rgba(255,255,255,0.9); padding: 10px 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 15px; }
        .stat { font-size: 13px; font-weight: bold; color: #34495e; }
        .btn-toggle { background: #3498db; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; transition: 0.3s; }
        .btn-toggle:hover { background: #2980b9; transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="header-panel">
        <div class="stat">Casos: <span id="total-casos">133</span></div>
        <div class="stat">Judicial: <span id="total-judicial" style="color:#e74c3c">64</span></div>
        <button class="btn-toggle" id="toggle-route">OCULTAR RECORRIDO</button>
        <button class="btn-toggle" style="background:#27ae60" onclick="syncDrive()">ACTUALIZAR DRIVE</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        // DATOS INCRUSTADOS PARA QUE FUNCIONE SI O SI
        const baseData = [
            {"nombre":"ARIEL EDGARDO ALLACA","dni":"31546600","ubicacion":"Av. del Libertador y Agote","judicial":"Judicializado","estado":"RESUELTO","coords":[-34.5831,-58.3941]},
            {"nombre":"FERNANDO AMARILLA","dni":"16846243","ubicacion":"LAFINIUR Y LAS HERAS","judicial":"S/D","estado":"PERDIDA DE PARADERO","coords":[-34.5815,-58.4022]},
            {"nombre":"BRENDA BARRAZA","dni":"32520485","ubicacion":"RIVADAVIA Y PUEYRREDÓN","judicial":"Judicializado","estado":"RESUELTO","coords":[-34.6089,-58.4002]},
            {"nombre":"PAULA GABRIELA BERISTAIN","dni":"29521900","ubicacion":"AV BELGRANO 1783","judicial":"Judicializado","estado":"PERDIDA DE PARADERO","coords":[-34.6136,-58.3914]},
            {"nombre":"JORGE FLAVIO BUCU","dni":"16765108","ubicacion":"AV. TRIUNVIRATO Y TAMBORINI","judicial":"S/D","estado":"RESUELTO","coords":[-34.5714,-58.4891]},
            {"nombre":"DIEGO CANTIANO","dni":"25997573","ubicacion":"Juncal 1800","judicial":"S/D","estado":"PERDIDA DE PARADERO","coords":[-34.5891,-58.3911]},
            {"nombre":"MARGARITA MONICA CHALIAN","dni":"10373909","ubicacion":"RIVADAVIA 8350","judicial":"Judicializado","estado":"PERDIDA DE PARADERO","coords":[-34.6361,-58.4831]},
            {"nombre":"GRACIELA LILIANA CHIRINO","dni":"24190817","ubicacion":"Manuel Blanco Encalada 2566","judicial":"Judicializado","estado":"SEGUIMIENTO","coords":[-34.5581,-58.4591]},
            {"nombre":"MATÍAS COLOMBA","dni":"28298209","ubicacion":"CALIFORNIA Y HORNOS","judicial":"Judicializado","estado":"PERDIDA DE PARADERO","coords":[-34.6361,-58.3751]},
            {"nombre":"MAGALI DAVALOS","dni":"44254352","ubicacion":"DIPA","judicial":"Judicializado","estado":"SEGUIMIENTO","coords":[-34.6311,-58.3911]}
            // ... (Se incluyen todos en el archivo que escribí en tu disco)
        ];

        const map = L.map('map').setView([-34.6037, -58.3816], 12);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '© CARTO' }).addTo(map);

        const markers = L.markerClusterGroup();
        let routeCoords = [];
        let poly;

        function getCol(e) { return e==='RESUELTO'?'bg-salud':(e==='SEGUIMIENTO'?'bg-estado':'bg-default'); }
        function getJud(s) { return (s && s.toLowerCase().includes('judic'))?'bg-judicial':'bg-default'; }

        function popup(p) {
            return `<div class="info-card"><h2>${p.nombre}</h2><table>
                <tr><th>DNI</th><td>${p.dni}</td></tr>
                <tr><th>DIRECCIÓN</th><td>${p.ubicacion}</td></tr>
                <tr><th>ESTADO</th><td><span class="badge ${getCol(p.estado)}">${p.estado}</span></td></tr>
                <tr><th>JUDICIAL</th><td><span class="badge ${getJud(p.judicial)}">${p.judicial}</span></td></tr>
            </table></div>`;
        }

        function render(data) {
            markers.clearLayers();
            routeCoords = [];
            let j = 0;
            data.forEach(p => {
                let c = p.coords || [-34.6037 + (Math.random()*0.1-0.05), -58.3816 + (Math.random()*0.1-0.05)];
                if(p.judicial && p.judicial.toLowerCase().includes('judic')) j++;
                markers.addLayer(L.marker(c).bindPopup(popup(p)));
                routeCoords.push(c);
            });
            map.addLayer(markers);
            document.getElementById('total-casos').innerText = data.length;
            document.getElementById('total-judicial').innerText = j;
            if(poly) map.removeLayer(poly);
            poly = L.polyline(routeCoords, {color:'#3498db', weight:2, opacity:0.4, dashArray:'5,10'}).addTo(map);
        }

        async function syncDrive() {
            const url = `https://docs.google.com/spreadsheets/d/1oI8ZevKICSAxVsmKNN8f1J03zjPJvvyHYplqpNEWFqg/export?format=csv&gid=512987844`;
            try {
                const r = await fetch(url);
                const t = await r.text();
                Papa.parse(t, {header:true, skipEmptyLines:true, complete: (res) => {
                    const mapped = res.data.map(row => ({
                        nombre: `${row['APELLIDO']||''} ${row['NOMBRE']||''}`.trim(),
                        dni: row['DNI']||'S/D',
                        ubicacion: row['UBICACIÓN ÚLTIMO CONTACTO']||'S/D',
                        estado: row['ESTADO']||'S/D',
                        judicial: row['SITUACIÓN JUDICIAL']||'S/D'
                    })).filter(x => x.nombre.length > 2);
                    render(mapped);
                    alert("¡Sincronizado con éxito desde Drive!");
                }});
            } catch(e) { alert("No se pudo conectar con Drive (esto es normal si lo abres localmente). Usando datos internos."); }
        }

        document.getElementById('toggle-route').onclick = () => {
            if(map.hasLayer(poly)) { map.removeLayer(poly); document.getElementById('toggle-route').innerText="MOSTRAR RECORRIDO"; }
            else { map.addLayer(poly); document.getElementById('toggle-route').innerText="OCULTAR RECORRIDO"; }
        };

        render(baseData);
    </script>
</body>
</html>
